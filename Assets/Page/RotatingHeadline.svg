<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 64" role="img" aria-labelledby="title desc">
  <title id="title">Citron rotating headline</title>
  <desc id="desc">Play Minecraft. Stay in the flow. Skip the setup. Keep it simple.</desc>
  <style>
    @keyframes phrase1 { 0%, 24.999% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes phrase2 { 0%, 24.999% { opacity: 0; } 25%, 49.999% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes phrase3 { 0%, 49.999% { opacity: 0; } 50%, 74.999% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes phrase4 { 0%, 74.999% { opacity: 0; } 75%, 99.999% { opacity: 1; } 100% { opacity: 0; } }
    .word { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 34px; font-weight: 600; text-anchor: middle; fill: #FFB23E; animation-duration: 4s; animation-iteration-count: infinite; animation-timing-function: steps(1, end); }
    .word1 { animation-name: phrase1; }
    .word2 { animation-name: phrase2; }
    .word3 { animation-name: phrase3; }
    .word4 { animation-name: phrase4; }
    @media (prefers-reduced-motion: reduce) {
      .word { animation: none !important; opacity: 0; }
      .word1 { opacity: 1; }
    }
  </style>
  <rect x="1" y="1" width="438" height="62" rx="9" fill="#1F1F1F" stroke="#FD9A0A" stroke-width="2"/>
  <text class="word word1" x="220" y="42">play Minecraft.</text>
  <text class="word word2" x="220" y="42">stay in the flow.</text>
  <text class="word word3" x="220" y="42">skip the setup.</text>
  <text class="word word4" x="220" y="42">keep it simple.</text>
</svg>