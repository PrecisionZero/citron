name: Bug Report
description: Report a technical issue or performance regression
title: "[BUG]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a concise summary of the issue.
      placeholder: What happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Minecraft & Citron Build ID
      placeholder: e.g., 1.0.0-dev.7+mc1.21.11.fabric
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Explain the actions you took
      description: What steps did you take to encounter the bug?
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and Attachments
      description: Drag and drop your latest.log, crash report, or screenshots directly into this box.
      placeholder: Attach files by dragging and dropping them here.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Hardware specifications (CPU/GPU) or additional mods.
